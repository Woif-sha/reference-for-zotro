name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: >-
          node -e "const version = require('./package.json').version;
          const expected = 'v' + version;
          if (process.env.GITHUB_REF_NAME !== expected) {
            console.error('Release tag must equal ' + expected);
            process.exit(1);
          }
          const name = require('./package.json').config.addonName;
          if (name.includes('(Second-stage Test)')) {
            console.error('The second-stage test build cannot be published as a release.');
            process.exit(1);
          }"

      - name: Run complete source and artifact gate
        run: npm run verify

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          mapfile -t xpis < <(find build -maxdepth 1 -type f -name '*.xpi' -print)
          mapfile -t updates < <(find build -maxdepth 1 -type f -name 'update.json' -print)
          if [ "${#xpis[@]}" -ne 1 ] || [ "${#updates[@]}" -ne 1 ]; then
            echo "Release requires exactly one audited XPI and update.json." >&2
            exit 1
          fi
          assets=("${xpis[0]}" "${updates[0]}")

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "$tag" --draft=false
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --title "$tag" \
              --generate-notes
          fi
