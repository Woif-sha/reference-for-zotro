name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: >-
          node -e "const version = require('./package.json').version;
          const expected = 'v' + version;
          const requested = 'v' + process.env.INPUT_VERSION;
          if (requested !== expected) {
            console.error('Release tag must equal ' + expected);
            process.exit(1);
          }
          const name = require('./package.json').config.addonName;
          if (name.includes('(Second-stage Test)')) {
            console.error('The second-stage test build cannot be published as a release.');
            process.exit(1);
          }"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Run checks
        run: |
          timeout 60s npm test
          npm run test:scansci-python
          npm run typecheck
          npm run format:check
          npm run format:workflows
          npm run lint
          npm audit --omit=dev --audit-level=high

      - name: Build XPI
        run: npm run build

      - name: Verify XPI and update manifest
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          npm run audit:scansci-xpi
          node -e "const fs=require('fs');const pkg=require('./package.json');const value=JSON.parse(fs.readFileSync('build/update.json','utf8'));const update=value.addons?.[pkg.config.addonID]?.updates?.[0];const expected=process.env.REPOSITORY_URL+'/releases/download/v'+pkg.version+'/reference-for-zotero.xpi';if(update?.version!==pkg.version||update?.update_link!==expected)throw new Error('Invalid build/update.json')"

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          tag="v$VERSION"
          mapfile -t xpis < <(find build -maxdepth 1 -type f -name '*.xpi' -print)
          mapfile -t updates < <(find build -maxdepth 1 -type f -name 'update.json' -print)
          if [ "${#xpis[@]}" -ne 1 ] || [ "${#updates[@]}" -ne 1 ]; then
            echo "Release requires exactly one audited XPI and update.json." >&2
            exit 1
          fi
          assets=("${xpis[0]}" "${updates[0]}")

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists and is immutable." >&2
            exit 1
          fi
          if git rev-parse "$tag" >/dev/null 2>&1; then
            if [ "$(git rev-list -n 1 "$tag")" != "$SOURCE_COMMIT" ]; then
              echo "Existing tag $tag does not point to the release commit." >&2
              exit 1
            fi
          else
            git tag "$tag" "$SOURCE_COMMIT"
            git push origin "$tag"
          fi

          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          changelog_url="https://github.com/$GITHUB_REPOSITORY/blob/$tag/CHANGELOG.md"
          awk -v version="$VERSION" '
            index($0, "## [" version "] - ") == 1 { copying=1; next }
            copying && /^## / { exit }
            copying { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changes.md"
          {
            echo "# [**$tag**]($release_url)"
            echo
            echo "## 更新内容"
            cat "$RUNNER_TEMP/changes.md"
            echo
            echo "## 安装与更新"
            echo
            echo "- 下载本 Release 中的 XPI，在 Zotero 的“工具 → 插件”中选择“从文件安装插件”，然后完全重启 Zotero。"
            echo "- 已安装稳定版的用户也可通过 Zotero 插件更新通道获取本版本。"
            echo
            echo "## 发布校验"
            echo
            echo "- GitHub Actions 已完成自动化测试、TypeScript、ESLint、格式检查、生产依赖审计、生产构建及 XPI 与更新清单核对。"
            echo
            echo "## 完整记录"
            echo
            echo "- [CHANGELOG.md]($changelog_url)"
          } > "$RUNNER_TEMP/release-notes.md"

          gh release create "$tag" "${assets[@]}" \
            --verify-tag \
            --title "$tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
