name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run ScanSci Python tests
        run: npm run test:scansci-python

      - name: Check types
        run: npm run typecheck

      - name: Lint source and tests
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check workflow formatting
        run: npx prettier --check ".github/workflows/*.yml"

  scansci-windows:
    name: ScanSci Windows boundaries
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run ScanSci TypeScript contracts
        run: node --test --test-concurrency=1 --test-timeout=60000 --import tsx test/scansci/*.test.ts

      - name: Run ScanSci Python contracts
        run: npm run test:scansci-python

      - name: Check types
        run: npm run typecheck

  package:
    name: Package XPI
    needs:
      - verify
      - scansci-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Build production XPI
        run: npm run build

      - name: Audit ScanSci XPI contents
        run: npm run audit:scansci-xpi

      - name: Upload packaged extension
        uses: actions/upload-artifact@v7
        with:
          name: reference-for-zotero-${{ github.sha }}
          path: |
            build/reference-for-zotero.xpi
            build/update.json
          if-no-files-found: error
          retention-days: 14
