name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Require dev for main promotions
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if [[ "$GITHUB_HEAD_REF" != "dev" ]]; then
            echo "main accepts changes only from dev; received $GITHUB_HEAD_REF" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          timeout 60s npm test
          npm run test:scansci-python

      - name: Check types
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check && npm run format:workflows

      - name: Run ESLint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build XPI
        run: npm run build

      - name: Verify XPI and update manifest
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          npm run audit:scansci-xpi
          node -e "const fs=require('fs');const pkg=require('./package.json');const value=JSON.parse(fs.readFileSync('build/update.json','utf8'));const update=value.addons?.[pkg.config.addonID]?.updates?.[0];const expected=process.env.REPOSITORY_URL+'/releases/download/v'+pkg.version+'/reference-for-zotero.xpi';if(update?.version!==pkg.version||update?.update_link!==expected)throw new Error('Invalid build/update.json')"

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: reference-for-zotero-${{ github.sha }}
          path: build/*.xpi
          if-no-files-found: error
          retention-days: 14
